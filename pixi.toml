# mojo-http2 — HPACK (RFC 7541) and HTTP/2 (RFC 9113) for Mojo 1.0.
#
# This repo publishes TWO packages: mojo-hpack (src/hpack, stdlib-only) and
# mojo-h2 (src/h2, depends on mojo-hpack + mojo-net). Inside the grpc-mojo
# monorepo this manifest is a self-contained dev workspace; per-package
# [package] manifests are finalized at publish time
# (see ../../docs/PACKAGING.md).

[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mojo-http2"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"
license = "Apache-2.0"
preview = ["pixi-build"]

[tasks]
# h2 needs mojo-net on the include path (declared dependency); the path is
# resolved by tools/dep_src.py: $MOJO_DEPS_DIR, .deps/ (fetch_deps.py), or
# a sibling ../mojo-net checkout.
test = "python3 tools/run_tests.py"
compliance = "python3 compliance/run_compliance.py"
bench = "NET=$(python3 tools/dep_src.py mojo-net) && mojo run -I src -I $NET bench/bench_http2.mojo"
bench-smoke = "NET=$(python3 tools/dep_src.py mojo-net) && mojo run -I src -I $NET bench/bench_http2.mojo --smoke"
gen-hpack = "python3 tools/gen_hpack_tables.py"

[dependencies]
mojo = ">=1.0.0,<2"
python = ">=3.11"

[pypi-dependencies]
hpack = ">=4.0"
h2 = ">=4.1"
hyperframe = ">=6.0"
