# mojo-http2: HPACK (RFC 7541) and HTTP/2 (RFC 9113) for Mojo 1.0.
#
# The mojo-http2 distribution contains both public modules: hpack is
# standalone, while h2 depends on hpack, mojo-net, and mojo-tls.

[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mojo-http2"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.2.3"
license = "Apache-2.0"
preview = ["pixi-build"]

[tasks]
# h2 needs mojo-net and mojo-tls on the include path. Their paths are
# resolved by tools/dep_src.py through $MOJO_DEPS_DIR, .deps/, or sibling
# package checkouts.
prepare-tls = "python3 tools/prepare_tls.py"
test = { cmd = "python3 -B compliance/test_h2spec_badge.py && python3 tools/run_tests.py", depends-on = ["prepare-tls"] }
compliance = { cmd = "python3 compliance/run_compliance.py", depends-on = ["prepare-tls"] }
bench = "NET=$(python3 tools/dep_src.py mojo-net) && TLS=$(python3 tools/dep_src.py mojo-tls) && mojo run -I src -I $NET -I $TLS bench/bench_http2.mojo"
bench-smoke = "NET=$(python3 tools/dep_src.py mojo-net) && TLS=$(python3 tools/dep_src.py mojo-tls) && mojo run -I src -I $NET -I $TLS bench/bench_http2.mojo --smoke"
example-h2c-loopback = "NET=$(python3 tools/dep_src.py mojo-net) && TLS=$(python3 tools/dep_src.py mojo-tls) && mojo run -I src -I $NET -I $TLS examples/h2c_loopback.mojo"
gen-hpack = "python3 tools/gen_hpack_tables.py"
package-test = "python3 packaging/test_installed_package.py"

[dependencies]
mojo = ">=1.0.0,<2"
python = ">=3.11"
openssl = ">=3"
c-compiler = "*"

[package]
name = "mojo-http2"
version = "0.2.3"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "0.*" }

[pypi-dependencies]
hpack = ">=4.0"
h2 = ">=4.1"
hyperframe = ">=6.0"
