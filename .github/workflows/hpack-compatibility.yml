name: HPACK compatibility

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hpack-compatibility:
    name: 10,000 stateful blocks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: latest
          cache: true
          post-cleanup: true

      - name: Run 10,000 stateful HPACK blocks
        run: |
          pixi run -x python3 compliance/test_hpack_randomized.py \
            --seed 7541 \
            --case-count 10000 \
            --timeout 120 \
            --probe-timeout 30 \
            --workflow-limit-minutes 30 \
            --mismatch-file hpack-compatibility-mismatch.json

      - name: Upload the first HPACK mismatch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hpack-compatibility-mismatch
          path: hpack-compatibility-mismatch.json
          if-no-files-found: ignore
          retention-days: 14
