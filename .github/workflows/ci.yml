name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h2-state-compatibility:
    name: HTTP/2 state compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: latest
          cache: true
          cache-write: false
          post-cleanup: true

      - name: Fetch source dependencies
        run: python3 tools/fetch_deps.py

      - name: Run deterministic HTTP/2 state checks
        run: pixi run h2-state-compatibility-smoke

      - name: Upload the first HTTP/2 mismatch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h2-state-mismatch
          path: build/h2-state-mismatch.json
          if-no-files-found: ignore

  hpack-compatibility:
    name: HPACK stateful compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: latest
          cache: true
          cache-write: false
          post-cleanup: true

      - name: Run HPACK stateful compatibility
        run: |
          seed=7541
          cases=250
          echo "HPACK stateful compatibility seed=$seed cases=$cases"
          pixi run -x python3 -B compliance/test_hpack_randomized_failures.py
          pixi run -x python3 compliance/test_hpack_randomized.py \
            --seed "$seed" \
            --case-count "$cases" \
            --timeout 60 \
            --probe-timeout 10 \
            --workflow-limit-minutes 15 \
            --mismatch-file hpack-compatibility-mismatch.json

      - name: Upload the first HPACK mismatch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hpack-compatibility-mismatch
          path: hpack-compatibility-mismatch.json
          if-no-files-found: ignore

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: latest
          cache: true
          post-cleanup: true

      - name: Fetch source dependencies (mojo-net, mojo-tls)
        run: python3 tools/fetch_deps.py

      - name: Install h2spec
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if brew untrust --tap | grep -Fxq "  aws/tap"; then
              brew untap aws/tap
            fi
            brew install h2spec
          else
            curl -sL https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz | tar xz
            sudo mv h2spec /usr/local/bin/
          fi

      - name: Docstring coverage (mojo doc gate)
        run: |
          net=$(python3 tools/dep_src.py mojo-net)
          tls=$(python3 tools/dep_src.py mojo-tls)
          total=0
          for f in src/hpack/*.mojo src/h2/*.mojo; do
            n=$(pixi run mojo doc -I src -I "$net" -I "$tls" --diagnose-missing-doc-strings -o /dev/null "$f" 2>&1 | grep -c warning || true)
            if [ "$n" != "0" ]; then echo "MISSING DOCS: $f ($n)"; total=$((total+n)); fi
          done
          test "$total" = "0"

      - name: Unit tests
        run: pixi run test

      - name: Incremental h2c loopback example
        run: pixi run example-h2c-loopback

      - name: HTTP/2 over TLS loopback example
        run: pixi run example-h2-tls-loopback

      - name: Benchmarks (smoke)
        run: pixi run bench-smoke

      - name: Compatibility suite (python-hpack, hyperframe, hyper-h2, h2spec)
        run: pixi run compliance

      - name: Verify published h2spec badge is current
        run: git diff --exit-code -- h2spec-badge.json

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-report-${{ matrix.os }}
          path: |
            COMPLIANCE.md
            COMPLIANCE.html
            h2spec-badge.json

  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: latest
          cache: true
          cache-write: false
          post-cleanup: true

      - name: Fetch source dependencies
        run: python3 tools/fetch_deps.py

      - name: Build and test the installed package
        run: pixi run package-test
