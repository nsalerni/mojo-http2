name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.11
        with:
          pixi-version: latest
          cache: true

      - name: Fetch source dependencies (mojo-net, mojo-tls)
        run: python3 tools/fetch_deps.py

      - name: Install h2spec
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install h2spec
          else
            curl -sL https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz | tar xz
            sudo mv h2spec /usr/local/bin/
          fi

      - name: Docstring coverage (mojo doc gate)
        run: |
          net=$(python3 tools/dep_src.py mojo-net)
          tls=$(python3 tools/dep_src.py mojo-tls)
          total=0
          for f in src/hpack/*.mojo src/h2/*.mojo; do
            n=$(pixi run mojo doc -I src -I "$net" -I "$tls" --diagnose-missing-doc-strings -o /dev/null "$f" 2>&1 | grep -c warning || true)
            if [ "$n" != "0" ]; then echo "MISSING DOCS: $f ($n)"; total=$((total+n)); fi
          done
          test "$total" = "0"

      - name: Unit tests
        run: pixi run test

      - name: Benchmarks (smoke)
        run: pixi run bench-smoke

      - name: Compatibility suite (python-hpack, hyperframe, hyper-h2, h2spec)
        run: pixi run compliance

      - name: Verify published h2spec badge is current
        run: git diff --exit-code -- h2spec-badge.json

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-${{ matrix.os }}
          path: |
            COMPLIANCE.md
            COMPLIANCE.html
            h2spec-badge.json

  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.11
        with:
          pixi-version: latest
          cache: true

      - name: Fetch source dependencies
        run: python3 tools/fetch_deps.py

      - name: Build and test the installed package
        run: pixi run package-test
